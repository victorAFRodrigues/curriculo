// ============================================================
//  FUNÇÕES UTILITÁRIAS — não precisa editar daqui pra baixo
// ============================================================

function calcularDuracao(inicio, fim) {
  const [mi, ai] = inicio.split("/").map(Number);
  let meses;
  if (fim === "Presente") {
    const hoje = new Date();
    meses = (hoje.getFullYear() - ai) * 12 + (hoje.getMonth() + 1 - mi);
  } else {
    const [mf, af] = fim.split("/").map(Number);
    meses = (af - ai) * 12 + (mf - mi);
  }
  const anos  = Math.floor(meses / 12);
  const resto = meses % 12;
  const partes = [];
  if (anos  > 0) partes.push(`${anos} ${anos  === 1 ? "ano"  : "anos"}`);
  if (resto > 0) partes.push(`${resto} ${resto === 1 ? "mês" : "meses"}`);
  return partes.join(" e ") || "menos de 1 mês";
}

function formatarPeriodo(inicio, fim) {
  const meses = ["janeiro","fevereiro","março","abril","maio","junho",
                 "julho","agosto","setembro","outubro","novembro","dezembro"];
  function fmt(str) {
    if (str === "Presente") return "Presente";
    const [m, a] = str.split("/");
    return `${meses[parseInt(m) - 1].charAt(0).toUpperCase() + meses[parseInt(m) - 1].slice(1)} de ${a}`;
  }
  return `${fmt(inicio)} – ${fmt(fim)}`;
}

function el(tag, attrs = {}, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  for (const c of children) {
    if (typeof c === "string") e.appendChild(document.createTextNode(c));
    else if (c) e.appendChild(c);
  }
  return e;
}

function hr() { return document.createElement("hr"); }

function secao(titulo) {
  return [el("h2", {}, titulo), hr()];
}

function li(texto) {
  const item = document.createElement("li");
  item.textContent = texto;
  return item;
}

// ============================================================
//  RENDERIZAÇÃO
// ============================================================
document.addEventListener("DOMContentLoaded", () => {

  // Nome

  // Subtítulo

  // Contato

    CV.cidade,
    CV.telefone,
    CV.email,
    CV.linkedin,
    `Disponível: ${CV.disponibilidade}`,
  ].forEach(txt => contact.appendChild(el("span", {}, txt)));
  body.appendChild(contact);

  // Resumo
  secao("Resumo Profissional").forEach(n => body.appendChild(n));
  const resumoTexto = CV.resumo.replace("{anos}", CV.anosDeExperiencia);
  body.appendChild(el("p", {}, resumoTexto));

  // Marcos
  secao("Principais Marcos").forEach(n => body.appendChild(n));
  const ulMarcos = el("ul");
  CV.marcos.forEach(m => ulMarcos.appendChild(li(m)));
  body.appendChild(ulMarcos);

  // Experiências
  secao("Experiência Profissional").forEach(n => body.appendChild(n));
  CV.experiencias.forEach(exp => {
    const duracao = exp.duracao ?? calcularDuracao(exp.inicio, exp.fim);
    const periodo = formatarPeriodo(exp.inicio, exp.fim);
    const metaParts = [exp.empresa, periodo];
    if (exp.fim !== "Presente") metaParts.push(duracao);
    if (exp.local) metaParts.push(exp.local);

    body.appendChild(el("div", { class: "job-title" }, exp.cargo));
    body.appendChild(el("div", { class: "job-meta" }, metaParts.join(" \u00a0|\u00a0 ")));

    const ulBullets = el("ul");
    exp.bullets.forEach(b => ulBullets.appendChild(li(b)));
    body.appendChild(ulBullets);
  });

  // Habilidades
  secao("Habilidades Técnicas").forEach(n => body.appendChild(n));
  CV.habilidades.forEach(({ categoria, itens }) => {
    const row = el("div", { class: "skills-row" });
    row.appendChild(el("strong", {}, `${categoria}:`));
    row.appendChild(document.createTextNode(" " + itens.join(", ")));
    body.appendChild(row);
  });

  // Formação
  secao("Formação Acadêmica").forEach(n => body.appendChild(n));
  CV.formacao.forEach((f, i) => {
    const d = el("div", { class: "job-title" });
    if (i > 0) d.style.marginTop = "10px";
    const statusLabel = f.status ? ` (${f.status})` : "";
    d.textContent = f.curso + statusLabel;
    body.appendChild(d);
    body.appendChild(el("div", { class: "job-meta" }, `${f.instituicao} \u00a0|\u00a0 ${f.periodo}`));
  });

  // Certificações
  secao("Certificações").forEach(n => body.appendChild(n));
  const ulCerts = el("ul");
  CV.certificacoes.forEach(c => ulCerts.appendChild(li(c)));
  body.appendChild(ulCerts);

  // Idiomas
  secao("Idiomas").forEach(n => body.appendChild(n));
  const ulIdiomas = el("ul");
  CV.idiomas.forEach(({ idioma, nivel }) => ulIdiomas.appendChild(li(`${idioma} — ${nivel}`)));
  body.appendChild(ulIdiomas);
});

<script src="https://cdnjs.cloudflare.com/ajax/libs/docx/8.5.0/docx.umd.min.js"></script>
<script>
async function exportDocx() {
  const status = document.getElementById('popup-status');
  status.className = 'popup-status';
  status.textContent = 'Gerando DOCX…';

  try {
    const {
      Document, Packer, Paragraph, TextRun, AlignmentType,
      BorderStyle, LevelFormat, HeadingLevel
    } = docx;

    // helpers
    const BLUE = "1565C0", DARK = "0F1923", GRAY = "546E7A";
    const font = "Arial";

    const t  = (text, opts = {}) => new TextRun({ text, font, size: 22, color: DARK, ...opts });
    const tb = (text, opts = {}) => t(text, { bold: true, ...opts });

    const p  = (...runs) => new Paragraph({ children: runs, spacing: { after: 60 } });
    const ph1 = (text)   => new Paragraph({
      heading: HeadingLevel.HEADING_1,
      spacing: { after: 40 },
      children: [new TextRun({ text, font, size: 40, bold: true, color: DARK })]
    });
    const pSub = (text) => new Paragraph({
      spacing: { after: 40 },
      children: [new TextRun({ text, font, size: 22, color: GRAY })]
    });
    const pContact = (text) => new Paragraph({
      spacing: { after: 120 },
      children: [new TextRun({ text, font, size: 20, color: GRAY })]
    });
    const pSection = (text) => new Paragraph({
      spacing: { before: 280, after: 80 },
      border: { bottom: { style: BorderStyle.SINGLE, size: 8, color: BLUE, space: 4 } },
      children: [new TextRun({ text: text.toUpperCase(), font, size: 20, bold: true, color: BLUE })]
    });
    const pJobTitle = (text) => new Paragraph({
      spacing: { before: 180, after: 20 },
      children: [new TextRun({ text, font, size: 22, bold: true, color: DARK })]
    });
    const pJobMeta = (text) => new Paragraph({
      spacing: { after: 60 },
      children: [new TextRun({ text, font, size: 20, color: GRAY })]
    });
    const pBullet = (text) => new Paragraph({
      numbering: { reference: "bullets", level: 0 },
      spacing: { before: 40, after: 40 },
      children: [new TextRun({ text, font, size: 20, color: DARK })]
    });
    const pSkill = (cat, itens) => new Paragraph({
      spacing: { after: 60 },
      children: [
        new TextRun({ text: cat + ": ", font, size: 20, bold: true, color: DARK }),
        new TextRun({ text: itens.join(", "), font, size: 20, color: DARK }),
      ]
    });

    // Build content
    const children = [];

    // Header
    children.push(ph1(CV.nome));
    children.push(pSub(CV.titulo.join(" | ")));
    children.push(pContact([CV.cidade, CV.telefone, CV.email, CV.linkedin, `Disponível: ${CV.disponibilidade}`].join("   |   ")));

    // Resumo
    children.push(pSection("Resumo Profissional"));
    children.push(p(t(CV.resumo.replace("{anos}", CV.anosDeExperiencia))));

    // Marcos
    children.push(pSection("Principais Marcos"));
    CV.marcos.forEach(m => children.push(pBullet(m)));

    // Experiência
    children.push(pSection("Experiência Profissional"));
    CV.experiencias.forEach(exp => {
      const duracao = exp.duracao ?? calcularDuracao(exp.inicio, exp.fim);
      const periodo = formatarPeriodo(exp.inicio, exp.fim);
      const metaParts = [exp.empresa, periodo];
      if (exp.fim !== "Presente") metaParts.push(duracao);
      if (exp.local) metaParts.push(exp.local);

      children.push(pJobTitle(exp.cargo));
      children.push(pJobMeta(metaParts.join("   |   ")));
      exp.bullets.forEach(b => children.push(pBullet(b)));
    });

    // Habilidades
    children.push(pSection("Habilidades Técnicas"));
    CV.habilidades.forEach(({ categoria, itens }) => children.push(pSkill(categoria, itens)));

    // Formação
    children.push(pSection("Formação Acadêmica"));
    CV.formacao.forEach(f => {
      const statusLabel = f.status ? ` (${f.status})` : "";
      children.push(pJobTitle(f.curso + statusLabel));
      children.push(pJobMeta(`${f.instituicao}   |   ${f.periodo}`));
    });

    // Certificações
    children.push(pSection("Certificações"));
    CV.certificacoes.forEach(c => children.push(pBullet(c)));

    // Idiomas
    children.push(pSection("Idiomas"));
    CV.idiomas.forEach(({ idioma, nivel }) => children.push(pBullet(`${idioma} — ${nivel}`)));

    const doc = new Document({
      numbering: {
        config: [{
          reference: "bullets",
          levels: [{
            level: 0, format: LevelFormat.BULLET, text: "-",
            alignment: AlignmentType.LEFT,
            style: { paragraph: { indent: { left: 400, hanging: 200 } } }
          }]
        }]
      },
      sections: [{
        properties: {
          page: { margin: { top: 900, right: 1080, bottom: 900, left: 1080 } }
        },
        children
      }]
    });

    const blob = await Packer.toBlob(doc);
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement("a");
    const nome = CV.nome.toLowerCase().replace(/\s+/g, "_");
    a.href = url; a.download = `curriculo_${nome}.docx`;
    a.click();
    URL.revokeObjectURL(url);

    status.textContent = "Download iniciado!";
    setTimeout(() => { status.textContent = ""; }, 3000);

  } catch (err) {
    console.error(err);
    status.className = "popup-status error";
    status.textContent = "Erro ao gerar DOCX. Veja o console.";
  }
}
</script>
</body>
</html>
